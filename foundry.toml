[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 32
max_test_rejects = 65536

[profile.default.invariant]
runs = 8
depth = 16
fail_on_revert = false

[profile.default.fmt]
line_length = 100
